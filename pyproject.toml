[project]
name = "evn-cskh-home-assistant"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11,<4"]

[project.optional-dependencies]
dev = [
    "homeassistant==2025.12.5",
    "pytest==9.1.1",
    "pytest-asyncio>=1,<2",
    "mypy==2.4.0",
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["analysis", ".venv", "dist"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
namespace_packages = true
files = ["custom_components/evn_cskh", "poc/evn_cskh.py", "build_release.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
